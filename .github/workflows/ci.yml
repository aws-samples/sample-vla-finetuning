name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cdk:
    name: tsc + jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest

  python:
    name: python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The tests never call AWS; this keeps boto3 from probing instance metadata.
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r mcp/requirements.txt
      - run: scripts/run-python-tests.sh
      # The unit tests stub the MCP SDK, so load the real server once: an SDK change
      # that breaks the import (e.g. mcp 2.x dropping FastMCP) fails here.
      - name: MCP server loads and registers its tools
        working-directory: mcp
        run: python check_server.py
