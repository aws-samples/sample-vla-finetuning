version: 2
updates:
  # One weekly PR for all npm updates instead of one PR per package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-all:
        patterns: ["*"]
    ignore:
      # ts-jest 29 accepts typescript <7; move both together by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Track the Node major CI runs on (22), not the latest @types/node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: weekly
    groups:
      pip-all:
        patterns: ["*"]
    ignore:
      # server.py is written against mcp 1.x (FastMCP); 2.x needs a code migration.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-all:
        patterns: ["*"]
